name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Advisory only — never fails the build (see REDTEAM.md attack #6).
      - name: Flag judge-file changes
        continue-on-error: true
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          if [ -n "$changed" ] && echo "$changed" | grep -E '^(tests/|src/(check|rules_security|mutation|cases|fixture)\.rs|loop/judge\.sh|\.github/workflows/)'; then
            echo "::warning::judge files changed - human review required (REDTEAM.md)"
          fi
          exit 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build
        run: |
          set +e
          cargo build --locked > /tmp/build.log 2>&1
          code=$?
          cat /tmp/build.log
          if [ $code -ne 0 ]; then
            echo "::error::Build failed (exit $code):"
            tail -20 /tmp/build.log | sed 's/^/  /'
            exit $code
          fi

      - name: Test
        run: |
          set +e
          cargo test --locked > /tmp/test.log 2>&1
          code=$?
          cat /tmp/test.log
          if [ $code -ne 0 ]; then
            echo "::error::Test failed (exit $code):"
            tail -20 /tmp/test.log | sed 's/^/  /'
            exit $code
          fi

      - name: Clippy
        run: |
          set +e
          cargo clippy --locked --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          code=$?
          cat /tmp/clippy.log
          if [ $code -ne 0 ]; then
            echo "::error::Clippy failed (exit $code):"
            tail -20 /tmp/clippy.log | sed 's/^/  /'
            exit $code
          fi

      - name: Full gate
        run: |
          set +e
          cargo run --locked -- all . > /tmp/gate.log 2>&1
          code=$?
          cat /tmp/gate.log
          if [ $code -ne 0 ]; then
            echo "::error::Full gate failed (exit $code):"
            tail -20 /tmp/gate.log | sed 's/^/  /'
            exit $code
          fi

      # `all` aggregates every guard. Adding a new sentinel to main.rs is
      # enough to make CI enforce it — no extra workflow step needed.
