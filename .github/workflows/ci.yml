name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Full gate (replay + mutation + gate + cases + regression)
        run: cargo run --locked -- all .

      # `all` aggregates every guard. Adding a new sentinel to main.rs is
      # enough to make CI enforce it — no extra workflow step needed.
