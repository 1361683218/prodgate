name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Advisory only — never fails the build (see REDTEAM.md attack #6).
      - name: Flag judge-file changes
        continue-on-error: true
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          if [ -n "$changed" ] && echo "$changed" | grep -E '^(tests/|src/(check|rules_security|mutation|cases|fixture)\.rs|loop/judge\.sh|\.github/workflows/)'; then
            echo "::warning::judge files changed - human review required (REDTEAM.md)"
          fi
          exit 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build
        run: |
          set -o pipefail
          cargo build --locked 2>&1 | tee /tmp/build.log

      - name: Test
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee /tmp/test.log

      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log

      - name: Full gate
        run: |
          set -o pipefail
          cargo run --locked -- all . 2>&1 | tee /tmp/gate.log

      # `all` aggregates every guard. Adding a new sentinel to main.rs is
      # enough to make CI enforce it — no extra workflow step needed.
