note = "Second hunk of the same commit as c001, from server/controllers/chatController.js. CHAT_AES_KEY fell back to a hardcoded AES key used to encrypt messages; production now throws if the variable is missing. Both samples are verbatim from the diff. c001 covered JWT_SECRET; this case covers a key name outside the original exact-match whitelist."
